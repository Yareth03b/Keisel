<!doctype html>
<html class="h-full bg-black dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="color-scheme" content="only dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Keisel - Sistema de Transporte Universitario</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icons/android-chrome-192x192.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png?v=6"
    />
    <link rel="shortcut icon" href="assets/icons/favicon.ico?v=6" />
    <link rel="manifest" href="site.webmanifest?v=6" />

    <!-- Tipografías e Iconos -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Librerías de Mapa y Estilos -->
    <script src="assets/tailwind.js"></script>
    <script>
      if (!window.tailwind) {
        document.write(
          '<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"><\/script>',
        );
      }
    </script>
    <link rel="stylesheet" href="assets/leaflet.css" />
    <script src="assets/leaflet.js"></script>

    <!-- Estilos CSS Modulares de Keisel -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="h-full bg-black text-white flex flex-col justify-between selection:bg-white selection:text-black select-none overflow-hidden"
  >
    <!-- ====================================================================== -->
    <!-- MAPA PRINCIPAL (LEAFLET EN EL FONDO)                                  -->
    <!-- ====================================================================== -->
    <div id="map"></div>

    <!-- ====================================================================== -->
    <!-- VISTA 1: INICIO (ESTUDIANTES)                                         -->
    <!-- ====================================================================== -->
    <div
      id="vista-inicio"
      class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-black overflow-y-auto px-4 py-8"
    >
      <main
        class="w-full max-w-[390px] flex flex-col items-center mx-auto space-y-6"
      >
        <!-- Logo Oficial Keisel en Vector Blanco/Dark -->
        <header
          class="w-full flex flex-col items-center justify-center pt-2 pb-2"
          data-purpose="brand-header"
        >
          <img
            src="assets/brand/logo_keisel_dark.svg?v=6"
            alt="Keisel Logo"
            class="h-24 sm:h-28 w-auto max-w-[280px] object-contain drop-shadow-lg"
          />
        </header>

        <!-- TARJETA 1: ESTUDIANTES (Sin texto extra abajo) -->
        <section class="w-full" data-purpose="card-estudiantes-wrapper">
          <div
            onclick="navegarA('mapa')"
            class="selection-card w-full h-[185px] rounded-[30px] p-6 flex flex-col justify-between cursor-pointer"
            role="button"
            tabindex="0"
            aria-label="Acceder como Estudiante"
          >
            <div class="w-full flex items-center justify-between">
              <div
                class="w-13 h-13 rounded-2xl bg-[#27272a] flex items-center justify-center shadow-inner"
              >
                <svg
                  class="w-7 h-7 text-white"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.3"
                  viewBox="0 0 24 24"
                >
                  <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                  <path d="M3 11h18"></path>
                  <path d="M19 19v2"></path>
                  <path d="M5 19v2"></path>
                  <circle
                    cx="7.5"
                    cy="15"
                    fill="currentColor"
                    r="1.2"
                    stroke="none"
                  ></circle>
                  <circle
                    cx="16.5"
                    cy="15"
                    fill="currentColor"
                    r="1.2"
                    stroke="none"
                  ></circle>
                </svg>
              </div>
              <div
                class="w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-sm"
              >
                <svg
                  class="w-4 h-4 text-black stroke-[3.5]"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>
            <div class="w-full pb-1">
              <span
                class="block text-[32px] font-black text-white tracking-tight leading-none"
              >
                Estudiantes
              </span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ====================================================================== -->
    <!-- VISTA 2: MAPA DE ESTUDIANTES EN VIVO (HUD DE SEGUIMIENTO)              -->
    <!-- ====================================================================== -->
    <div
      id="vista-mapa"
      class="hidden fixed inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 box-border"
    >
      <!-- Barra Superior Flotante -->
      <header class="pointer-events-auto w-full max-w-md mx-auto pt-safe">
        <div
          class="h-14 w-full px-4 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] flex items-center justify-between shadow-2xl"
        >
          <button
            onclick="retrocederDesdeMapa()"
            class="flex items-center gap-2 text-white hover:text-neutral-300 transition-colors py-1 pl-0.5 cursor-pointer"
            type="button"
          >
            <svg
              class="w-5 h-5 text-[#A0A0A0]"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
            <span
              id="btn-mapa-back-text"
              class="text-sm font-bold tracking-tight text-white"
              >Estudiantes</span
            >
          </button>

          <div
            class="flex items-center gap-2 bg-[#222222] px-3.5 py-1.5 rounded-full border border-white/20"
          >
            <span
              id="live-dot"
              class="w-2 h-2 rounded-full bg-[#8E8E93]"
            ></span>
            <span
              id="header-status"
              class="text-xs font-bold text-white uppercase tracking-wider"
              >SIN BUS EN RUTA</span
            >
          </div>

          <button
            onclick="abrirModalUbicacion()"
            class="w-8 h-8 rounded-full bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center justify-center active:scale-95 transition-all cursor-pointer"
            title="Configurar permiso de ubicación"
          >
            <span class="material-symbols-outlined text-[16px]">tune</span>
          </button>
        </div>
      </header>

      <!-- Controles Laterales Flotantes y Tarjeta Inferior Desplegable -->
      <div
        class="w-full max-w-md mx-auto flex flex-col gap-3 pointer-events-none pb-safe"
      >
        <div class="flex justify-end pointer-events-none">
          <div class="flex flex-col gap-2 pointer-events-auto">
            <!-- 1. Botón Centrar Mi Ubicación -->
            <button
              aria-label="Centrar en mi ubicación"
              class="w-11 h-11 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] text-white flex items-center justify-center shadow-2xl hover:bg-[#202024] active:scale-95 transition-all cursor-pointer"
              onclick="centrarEnMiUbicacion()"
              type="button"
              title="Ir a mi ubicación"
            >
              <svg
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="7"></circle>
                <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
                <line x1="12" y1="2" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="22"></line>
                <line x1="2" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="22" y2="12"></line>
              </svg>
            </button>

            <!-- 2. Botón Centrar en el Bus -->
            <button
              id="btn-centrar-bus"
              style="display: none"
              aria-label="Centrar en el Bus"
              class="w-11 h-11 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] text-white flex items-center justify-center shadow-2xl hover:bg-[#202024] active:scale-95 transition-all cursor-pointer"
              onclick="centrarEnBus()"
              type="button"
              title="Centrar mapa en el bus"
            >
              <svg
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                <path d="M3 11h18"></path>
                <circle
                  cx="7.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <circle
                  cx="16.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <path d="M6 19v2"></path>
                <path d="M18 19v2"></path>
              </svg>
            </button>

            <!-- 3 y 4. Controles de Zoom -->
            <div
              class="rounded-2xl bg-[#141416]/95 backdrop-blur-md border border-[#26262B] flex flex-col items-center overflow-hidden shadow-2xl"
            >
              <button
                aria-label="Acercar"
                class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all border-b border-[#242429] cursor-pointer"
                onclick="if (map) map.zoomIn();"
                type="button"
              >
                <svg
                  class="w-4 h-4 text-white"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  viewBox="0 0 24 24"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button
                aria-label="Alejar"
                class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all cursor-pointer"
                onclick="if (map) map.zoomOut();"
                type="button"
              >
                <svg
                  class="w-4 h-4 text-white"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  viewBox="0 0 24 24"
                >
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- BOTÓN FLOTANTE TIPO CIRCULITO (VISIBLE POR DEFECTO AL INICIAR) -->
        <div
          id="btn-desplegar-buses"
          style="display: flex"
          class="pointer-events-auto flex justify-end"
        >
          <button
            onclick="expandirPanelBuses()"
            class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center shadow-2xl border-2 border-black hover:bg-neutral-200 active:scale-95 transition-all cursor-pointer relative group"
            style="
              width: 44px;
              height: 44px;
              border-radius: 9999px;
              aspect-ratio: 1 / 1;
            "
            title="Ver información del bus"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="#000000"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <rect height="16" rx="4" width="18" x="3" y="3"></rect>
              <path d="M3 11h18"></path>
              <circle
                cx="7.5"
                cy="15"
                fill="#000000"
                r="1.2"
                stroke="none"
              ></circle>
              <circle
                cx="16.5"
                cy="15"
                fill="#000000"
                r="1.2"
                stroke="none"
              ></circle>
              <path d="M6 19v2"></path>
              <path d="M18 19v2"></path>
            </svg>
            <span
              class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-white border-2 border-black rounded-full animate-ping"
            ></span>
            <span
              class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-white border-2 border-black rounded-full"
            ></span>
          </button>
        </div>

        <!-- Tarjeta Flotante Inferior de Información del Bus (Compacta, Fila Única) -->
        <div
          id="panel-tarjeta-bus"
          style="display: none"
          class="w-full bg-[#141416]/95 backdrop-blur-xl border border-white/20 rounded-2xl px-4 py-3 shadow-2xl flex items-center justify-between gap-3 pointer-events-auto transition-all duration-300"
        >
          <!-- Izquierda: Ícono del Bus e Información Dinámica -->
          <div class="flex items-center gap-3 min-w-0">
            <div
              class="w-10 h-10 rounded-xl bg-[#222222] text-white flex items-center justify-center shadow-md shrink-0"
              id="bus-card-icon-bg"
            >
              <svg
                class="w-5 h-5 text-white"
                id="bus-card-icon"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                <path d="M3 11h18"></path>
                <circle
                  cx="7.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <circle
                  cx="16.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <path d="M6 19v2"></path>
                <path d="M18 19v2"></path>
              </svg>
            </div>
            <div class="min-w-0">
              <p
                class="text-sm font-extrabold text-white leading-tight truncate"
                id="bus-main-name"
              >
                Bus Universitario
              </p>
              <p
                class="text-[11px] text-neutral-400 font-medium truncate"
                id="bus-subtext"
              >
                Esperando señal GPS activa...
              </p>
            </div>
          </div>

          <!-- Derecha: Botón Seguir Bus, Badge EN VIVO y Botón Minimizar -->
          <div class="flex items-center gap-2 shrink-0">
            <div
              id="bus-chips-container"
              class="hidden sm:flex items-center gap-1"
            ></div>
            <span
              class="text-[9px] font-bold text-neutral-400 bg-neutral-800 px-2 py-0.5 rounded-full tracking-wider uppercase"
              id="bus-live-badge"
              >DESCONECTADO</span
            >
            <button
              id="btn-seguir-bus"
              onclick="centrarEnBus()"
              class="text-xs font-bold text-white bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl transition-all cursor-pointer flex items-center gap-1 active:scale-95"
              title="Centrar bus en el mapa"
            >
              <svg
                class="w-3.5 h-3.5 text-white"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path>
              </svg>
              <span>Seguir Bus</span>
            </button>
            <button
              onclick="achicarPanelBuses()"
              class="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center justify-center active:scale-95 transition-all cursor-pointer"
              title="Minimizar panel"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notificación Toast Flotante -->
    <div
      id="toast-notify"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#1C1E24] text-white text-xs px-4 py-2.5 rounded-full border border-neutral-700 shadow-2xl opacity-0 translate-y-2 pointer-events-none transition-all duration-300 flex items-center gap-2"
    >
      <span class="material-symbols-outlined text-[16px] text-white">info</span>
      <span id="toast-msg">Notificación</span>
    </div>

    <!-- Lógica y Funcionalidades JavaScript de Keisel -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>

    <!-- MODAL DE CONFIGURACIÓN DE PERMISO DE UBICACIÓN -->
    <div
      id="modal-permiso-ubicacion"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
    >
      <div
        class="bg-[#141416]/95 border border-[#26262B] rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center flex flex-col items-center"
      >
        <div
          class="w-14 h-14 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mb-4"
        >
          <span class="material-symbols-outlined text-[32px]">near_me</span>
        </div>
        <h3 class="text-lg font-bold text-white mb-2">Permiso de Ubicación</h3>
        <p class="text-xs text-neutral-400 mb-6 leading-relaxed">
          Keisel requiere tu ubicación para mostrarte los paraderos más cercanos
          y la distancia exacta al bus. Puedes cambiar esta opción en cualquier
          momento.
        </p>
        <div class="flex flex-col w-full gap-2.5">
          <button
            onclick="configurarPermisoUbicacion('siempre')"
            class="w-full py-3 px-4 bg-white hover:bg-neutral-200 text-black font-bold text-xs rounded-xl transition-all active:scale-95 cursor-pointer"
          >
            Permitir siempre
          </button>
          <button
            onclick="configurarPermisoUbicacion('momento')"
            class="w-full py-3 px-4 bg-neutral-800 hover:bg-neutral-700 text-white font-semibold text-xs rounded-xl border border-neutral-700 transition-all active:scale-95 cursor-pointer"
          >
            Solo en este momento
          </button>
          <button
            onclick="cerrarModalUbicacion()"
            class="w-full py-2.5 px-4 text-neutral-400 hover:text-white font-medium text-xs transition-colors cursor-pointer"
          >
            Ahora no
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
