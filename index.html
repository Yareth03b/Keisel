<!DOCTYPE html>
<html class="h-full bg-black dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Keisel</title>
  <link rel="icon" type="image/svg+xml" href="logo_keisel_dark.svg?v=2">
  
  <!-- Google Fonts: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #FFFFFF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      body { overscroll-behavior-y: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    }
    ::-webkit-scrollbar { display: none; }
    
    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111317;
      z-index: 1;
    }

    /* Respaldo CSS nativo cuando la máquina no tiene Internet (Offline LAN) */
    #vista-inicio {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 30;
      background-color: #000000;
      color: #FFFFFF;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #vista-inicio > div {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 540px;
    }
    #vista-inicio [data-purpose="student-selector-card"] {
      background-color: #161616;
      border: 2px solid #FFFFFF;
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      cursor: default;
      margin: 24px 0;
    }
    #vista-inicio svg {
      width: 32px;
      height: 32px;
    }
    #vista-inicio footer button {
      width: 100%;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
    }
    #vista-mapa {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 20;
      pointer-events: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      box-sizing: border-box;
    }
    #vista-mapa header, #panel-tarjeta-bus, #btn-desplegar-buses {
      pointer-events: auto;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }
    #vista-mapa header > div {
      background: rgba(20, 20, 22, 0.95);
      border: 1px solid #26262B;
      border-radius: 9999px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #panel-tarjeta-bus {
      background: rgba(20, 20, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 20px;
      color: #FFFFFF;
    }

    .bus-pulse-ring {
      position: absolute;
      top: -14px;
      left: -14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 0.95; }
      50% { transform: scale(1.4); opacity: 0.15; }
      100% { transform: scale(0.7); opacity: 0.95; }
    }

    .bus-pin-core {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #000000;
      border: 3px solid #FFFFFF;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    /* Punto blanco de la ubicacion del estudiante / usuario */
    .user-pulse-halo {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      border: 1.5px solid rgba(0, 0, 0, 0.35);
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .user-white-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3.5px solid #000000;
      box-shadow: 0 0 0 2px #FFFFFF, 0 4px 12px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    .leaflet-popup-content-wrapper {
      background: #141416 !important;
      color: #FFFFFF !important;
      border: 1px solid #333333 !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8) !important;
      font-family: 'Inter', sans-serif !important;
    }
    .leaflet-popup-tip {
      background: #141416 !important;
    }
  </style>
</head>
<body class="h-full bg-black text-white flex flex-col justify-between selection:bg-white selection:text-black select-none overflow-hidden">

  <!-- ========================================== -->
  <!-- MAPA PRINCIPAL (SIEMPRE ACTIVO Y VISIBLE) -->
  <!-- ========================================== -->
  <div id="map"></div>


  <!-- ========================================== -->
  <!-- VISTA 1: PORTAL DE BIENVENIDA ESTUDIANTE  -->
  <!-- ========================================== -->
  <div id="vista-inicio" style="display: flex;" class="fixed inset-0 z-30 flex-col items-center justify-center bg-black overflow-y-auto">
    <div class="w-full max-w-md mx-auto min-h-screen sm:min-h-[640px] flex flex-col justify-between px-6 py-10">
      
      <!-- Top: Logo Original Keisel SVG sin fondo y con letras blancas -->
      <header class="pt-1 flex items-center justify-center" data-purpose="brand-header">
        <img src="logo_keisel_dark.svg?v=2" alt="Keisel Logo" class="h-24 sm:h-28 w-auto object-contain" />
      </header>

      <!-- Center: Minimalist Uber Card / Active Selector -->
      <main class="my-auto py-8 w-full" data-purpose="selector-section">
        <div class="w-full bg-[#161616] border-2 border-white rounded-3xl p-6 sm:p-7 flex flex-col justify-between aspect-[4/3] shadow-2xl relative" data-purpose="student-selector-card">
          <!-- Top bar of the card with Minimalist Monochromatic Bus/Transport Icon -->
          <div class="flex items-center justify-between">
            <div class="w-14 h-14 bg-[#222222] rounded-2xl flex items-center justify-center text-white">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 6c0-1.657 1.343-3 3-3h10c1.657 0 3 1.343 3 3v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"></path>
                <path d="M4 11h16"></path>
                <circle cx="8" cy="15" fill="currentColor" r="1.5" stroke="none"></circle>
                <circle cx="16" cy="15" fill="currentColor" r="1.5" stroke="none"></circle>
                <path d="M6 19v2"></path>
                <path d="M18 19v2"></path>
              </svg>
            </div>
            <!-- Selection checkmark badge -->
            <div class="w-7 h-7 rounded-full bg-white text-black flex items-center justify-center shadow-md">
              <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </div>
          <!-- Large Typography Selector Title -->
          <div class="mt-auto">
            <h2 class="text-3xl sm:text-[34px] font-bold tracking-tight text-white leading-tight font-sans">
              Estudiantes
            </h2>
          </div>
        </div>
      </main>

      <!-- Bottom: Direct Action Uber-Style White Full Button -->
      <footer class="w-full pb-4" data-purpose="cta-section">
        <button onclick="mostrarMapa()" class="w-full bg-white hover:bg-neutral-200 active:scale-[0.98] transition-all duration-150 rounded-2xl py-4 sm:py-4.5 px-6 flex items-center justify-center text-black font-bold text-base sm:text-[17px] shadow-lg tracking-tight cursor-pointer" type="button">
          Ingresar al Mapa en Vivo
        </button>
      </footer>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- VISTA 2: CONTROLES FLOTANTES DEL MAPA     -->
  <!-- ========================================== -->
  <div id="vista-mapa" style="display: none;" class="fixed inset-0 z-20 pointer-events-none flex-col justify-between p-4 pb-safe pt-safe">
    
    <!-- Barra Superior Flotante -->
    <header class="w-full max-w-md mx-auto pointer-events-auto">
      <div class="h-14 w-full px-4 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] flex items-center justify-between shadow-2xl">
        <button class="flex items-center gap-2 text-white hover:text-neutral-300 transition-colors py-1 pl-0.5 cursor-pointer" onclick="regresarAInicio()" type="button">
          <span class="material-symbols-outlined text-xl text-[#A0A0A0]">arrow_back</span>
          <span class="text-sm font-bold tracking-tight text-white">Estudiantes</span>
        </button>
        
        <div class="flex items-center gap-2 bg-[#222222] px-3.5 py-1.5 rounded-full border border-white/20">
          <span class="w-2 h-2 rounded-full bg-[#8E8E93]" id="live-dot"></span>
          <span class="text-xs font-bold text-white uppercase tracking-wider" id="header-status">SIN BUS EN RUTA</span>
        </div>
      </div>
    </header>

    <!-- Controles Laterales y Tarjeta Inferior -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-3 pointer-events-none">
      <div class="flex justify-end pointer-events-none">
        <div class="flex flex-col gap-2 pointer-events-auto">
          <button aria-label="Centrar en mi ubicación" class="w-11 h-11 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] text-white flex items-center justify-center shadow-2xl hover:bg-[#202024] active:scale-95 transition-all cursor-pointer" onclick="centrarEnUsuario()" type="button" title="Ir a mi ubicación (Punto Blanco)">
            <span class="material-symbols-outlined text-xl text-white">my_location</span>
          </button>

          <button id="btn-centrar-bus" style="display: none;" aria-label="Centrar en el Bus" class="w-11 h-11 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] text-white flex items-center justify-center shadow-2xl hover:bg-[#202024] active:scale-95 transition-all cursor-pointer" onclick="centrarEnBus()" type="button" title="Centrar mapa en el bus">
            <span class="material-symbols-outlined text-xl text-white">directions_bus</span>
          </button>
          
          <div class="rounded-2xl bg-[#141416]/95 backdrop-blur-md border border-[#26262B] flex flex-col items-center overflow-hidden shadow-2xl">
            <button aria-label="Acercar" class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all border-b border-[#242429] cursor-pointer" onclick="if(map) map.zoomIn()" type="button">
              <span class="material-symbols-outlined text-base">add</span>
            </button>
            <button aria-label="Alejar" class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all cursor-pointer" onclick="if(map) map.zoomOut()" type="button">
              <span class="material-symbols-outlined text-base">remove</span>
            </button>
          </div>
        </div>
      </div>

      <!-- BOTÓN FLOTANTE TIPO CIRCULITO (VISIBLE POR DEFECTO AL INICIAR) -->
      <div id="btn-desplegar-buses" style="display: flex;" class="pointer-events-auto flex justify-end">
        <button onclick="expandirPanelBuses()" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center shadow-2xl border-2 border-black hover:bg-neutral-200 active:scale-95 transition-all cursor-pointer relative group" style="width: 44px; height: 44px; border-radius: 9999px; aspect-ratio: 1 / 1;" title="Ver información del bus">
          <span class="material-symbols-outlined text-xl font-bold">directions_bus</span>
          <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-white border-2 border-black rounded-full animate-ping"></span>
          <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-white border-2 border-black rounded-full"></span>
        </button>
      </div>

      <!-- Tarjeta Flotante del Bus Activo (Oculta al iniciar, se abre al tocar la bolita) -->
      <div id="panel-tarjeta-bus" style="display: none;" class="w-full bg-[#141416]/95 backdrop-blur-xl border border-white/20 rounded-3xl p-5 shadow-2xl flex flex-col gap-3 pointer-events-auto transition-all duration-300">
        <!-- Encabezado con Nombre del Bus, Badge En Vivo y Botón para Achicar -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-[#222222] text-white flex items-center justify-center shadow-md" id="bus-card-icon-bg">
              <span class="material-symbols-outlined text-white text-2xl" id="bus-card-icon">directions_bus</span>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-extrabold text-white tracking-tight" id="bus-title">Bus Barranca</h3>
                <span class="text-[9px] font-bold text-white bg-[#2C2C30] px-2 py-0.5 rounded-full tracking-wider uppercase" id="bus-live-badge">SIN SEÑAL</span>
              </div>
              <p class="text-xs text-[#8E8E93]" id="bus-subtext">Esperando transmisión del conductor</p>
            </div>
          </div>
          
          <div class="flex items-center gap-2">
            <!-- Botón para achicar a circulito -->
            <button onclick="achicarPanelBuses()" class="w-8 h-8 rounded-full bg-[#222222] hover:bg-white hover:text-black text-white border border-white/20 flex items-center justify-center transition-all cursor-pointer active:scale-95" title="Achicar menú">
              <span class="material-symbols-outlined text-xl">keyboard_arrow_down</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIG ---
    var SUPABASE_URL = "https://mcqcfdivpikmrkkfbhsm.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jcWNmZGl2cGlrbXJra2ZiaHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzg5NDIsImV4cCI6MjEwODg1NDk0Mn0.F6Yz31dJI4wQiINS1NwK-cNunO0V_3UEvD3IHgTJSC0";
    
    var supabaseClient = null;
    function getSupabase() {
      if (!supabaseClient && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
          console.warn("Supabase init:", e);
        }
      }
      return supabaseClient;
    }

    var UNI_LAT = -10.72635;
    var UNI_LNG = -77.77373;
    var centroInicial = [UNI_LAT, UNI_LNG];

    var map = null;
    var busMarker = null;
    var busPosActual = null;
    var ultimaRecepcionBus = 0;
    var ultimoTimestampVisto = null;
    var primeraConsultaTabla = true;
    var yaEnfocoBusCercano = false;
    var confirmacionesMovBus = 0;

    var userMarker = null;
    var userPosActual = centroInicial;
    var userPosFijada = null;
    var mejorAccuracyUsuario = 9999;
    var userWatchId = null;
    var yaCentroUsuario = false;
    var confirmacionesMovUser = 0;

    // Umbral anti-rebote GPS bajo techo (15 metros + confirmacion de 3 lecturas consecutivas)
    var UMBRAL_MOVIMIENTO_METROS = 15.0;

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // --- CAMBIO DE VISTAS (100% GARANTIZADO CON ESTILOS INLINE) ---
    function mostrarMapa() {
      var vistaInicio = document.getElementById('vista-inicio');
      var vistaMapa = document.getElementById('vista-mapa');
      
      if (vistaInicio) vistaInicio.style.display = 'none';
      if (vistaMapa) vistaMapa.style.display = 'flex';

      // Al iniciar el mapa, mostrar SOLO la bolita del menu de buses (panel achicado)
      achicarPanelBuses();

      if (!map) {
        initLeafletMap();
      }
      iniciarUbicacionUsuario();
      cargarUltimaPosicion();

      setTimeout(function() {
        if (map) {
          map.invalidateSize();
          // Enfocar automaticamente el bus mas cercano si esta activo
          if (busPosActual) {
            map.flyTo(busPosActual, 17, { animate: true, duration: 1 });
          } else if (userPosActual) {
            map.flyTo(userPosActual, 17, { animate: true, duration: 1 });
          }
        }
      }, 200);
    }

    function regresarAInicio() {
      var vistaInicio = document.getElementById('vista-inicio');
      var vistaMapa = document.getElementById('vista-mapa');
      
      if (vistaMapa) vistaMapa.style.display = 'none';
      if (vistaInicio) vistaInicio.style.display = 'flex';
    }

    function initLeafletMap() {
      if (map) return;
      if (typeof L === 'undefined') {
        console.warn("Leaflet aún no está disponible.");
        return;
      }

      // Inicializar mapa sobre el elemento #map (a pantalla completa)
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView(centroInicial, 16);

      // Usar OpenStreetMap oficial (100% visible, calles, colores y nombres reales)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      // Crear el Punto Blanco del Estudiante de inmediato en el mapa
      dibujarPuntoBlancoUsuario(userPosActual[0], userPosActual[1]);

      window.addEventListener('resize', function() { if (map) map.invalidateSize(); });

      // IMPORTANTE: No creamos el icono del bus hasta confirmar transmisión activa
      ocultarBus();
      cargarUltimaPosicion();
      conectarRealtime();
      iniciarUbicacionUsuario();

      // Consultar cada 1.5 segundos para garantizar actualización inmediata (incluso en segundo plano)
      setInterval(function() {
        cargarUltimaPosicion();
      }, 1500);

      // Verificar cada 3s si el conductor dejó de transmitir (más de 15s sin nuevos paquetes)
      setInterval(function() {
        if (busMarker && (Date.now() - ultimaRecepcionBus > 15000)) {
          ocultarBus();
        }
      }, 3000);
    }

    // --- UBICACIÓN EN TIEMPO REAL DEL ESTUDIANTE (PUNTO BLANCO ESTABILIZADO) ---
    function dibujarPuntoBlancoUsuario(lat, lng) {
      if (!map || typeof L === 'undefined') return;
      if (!userMarker) {
        var userIcon = L.divIcon({
          className: 'user-marker-container',
          html: '<div style="position:relative;"><div class="user-pulse-halo"></div><div class="user-white-dot"></div></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup("<b>Tu ubicación actual</b>");
      } else {
        userMarker.setLatLng([lat, lng]);
      }
    }

    function procesarLecturaGpsUsuario(pos) {
      if (!pos || !pos.coords) return;
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var accuracy = pos.coords.accuracy || 20;
      var speed = pos.coords.speed;

      // Si se abre en una Laptop (donde el Wi-Fi da baja precisión > 15m) y el celular está al lado transmitiendo (< 150m),
      // calibrar contra el GPS satelital del celular para eliminar el desfase de antena Wi-Fi de la laptop
      if (busPosActual && accuracy > 15) {
        var distAlBus = calcularDistanciaMetros(lat, lng, busPosActual[0], busPosActual[1]);
        if (distAlBus < 150) {
          lat = busPosActual[0] + 0.000012;
          lng = busPosActual[1] + 0.000015;
        }
      }

      // Primera lectura real del GPS del dispositivo: se clava en ese punto
      if (!userPosFijada) {
        userPosFijada = [lat, lng];
        userPosActual = [lat, lng];
        mejorAccuracyUsuario = accuracy;
        dibujarPuntoBlancoUsuario(lat, lng);

        if (!yaCentroUsuario && map && !busPosActual) {
          yaCentroUsuario = true;
          map.flyTo(userPosActual, 17, { animate: true, duration: 1 });
        }
        return;
      }

      // Descartar lecturas con mala precisión (> 40m)
      if (accuracy > 40) {
        return;
      }

      var distancia = calcularDistanciaMetros(userPosFijada[0], userPosFijada[1], lat, lng);

      // FILTRO ESTRICTO ANTI-SALTOS: Si la variacion es menor a 15 metros o velocidad ~0, se resetea el contador y NO se mueve nada
      if ((speed !== null && speed !== undefined && speed < 0.5 && distancia < 20.0) || distancia < UMBRAL_MOVIMIENTO_METROS) {
        confirmacionesMovUser = 0;
        return;
      }

      // Exigir 3 lecturas consecutivas fuera de los 15 metros para descartar rebotes falsos de GPS
      confirmacionesMovUser++;
      if (confirmacionesMovUser < 3) {
        return;
      }

      confirmacionesMovUser = 0;
      var latSuavizada = (userPosFijada[0] * 0.3) + (lat * 0.7);
      var lngSuavizada = (userPosFijada[1] * 0.3) + (lng * 0.7);

      userPosFijada = [latSuavizada, lngSuavizada];
      userPosActual = [latSuavizada, lngSuavizada];
      dibujarPuntoBlancoUsuario(latSuavizada, lngSuavizada);
    }

    function iniciarUbicacionUsuario() {
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          procesarLecturaGpsUsuario(pos);
        },
        function(err) {
          console.warn("Geolocalizacion inicial:", err.message);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );

      if (userWatchId === null) {
        userWatchId = navigator.geolocation.watchPosition(
          function(pos) {
            procesarLecturaGpsUsuario(pos);
          },
          function(err) {
            console.warn("Watch geolocalizacion:", err.message);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    }

    function centrarEnUsuario() {
      if (userPosActual && map) {
        map.flyTo(userPosActual, 17, { animate: true, duration: 0.8 });
        if (userMarker) userMarker.openPopup();
      }
      iniciarUbicacionUsuario();
    }

    function achicarPanelBuses() {
      var panel = document.getElementById('panel-tarjeta-bus');
      var btnCirculo = document.getElementById('btn-desplegar-buses');
      if (panel) panel.style.display = 'none';
      if (btnCirculo) btnCirculo.style.display = 'flex';
    }

    function expandirPanelBuses() {
      var panel = document.getElementById('panel-tarjeta-bus');
      var btnCirculo = document.getElementById('btn-desplegar-buses');
      if (btnCirculo) btnCirculo.style.display = 'none';
      if (panel) panel.style.display = 'flex';
    }

    // --- MOSTRAR U OCULTAR EL BUS SEGÚN TRANSMISIÓN REAL ---
    function ocultarBus() {
      if (busMarker && map) {
        map.removeLayer(busMarker);
        busMarker = null;
      }
      busPosActual = null;
      yaEnfocoBusCercano = false;
      confirmacionesMovBus = 0;

      var dotEl = document.getElementById('live-dot');
      if (dotEl) dotEl.className = "w-2 h-2 rounded-full bg-[#8E8E93]";

      var headerEl = document.getElementById('header-status');
      if (headerEl) headerEl.innerText = "SIN BUS EN RUTA";

      var badgeEl = document.getElementById('bus-live-badge');
      if (badgeEl) {
        badgeEl.innerText = "SIN SEÑAL";
        badgeEl.className = "text-[9px] font-bold text-white bg-[#2C2C30] px-2 py-0.5 rounded-full tracking-wider uppercase";
      }

      var iconBg = document.getElementById('bus-card-icon-bg');
      if (iconBg) iconBg.className = "w-11 h-11 rounded-2xl bg-[#222222] text-white flex items-center justify-center shadow-md";

      var iconEl = document.getElementById('bus-card-icon');
      if (iconEl) iconEl.className = "material-symbols-outlined text-white text-2xl";

      var subEl = document.getElementById('bus-subtext');
      if (subEl) subEl.innerText = "Esperando transmisión del conductor";

      var btnCentrarBus = document.getElementById('btn-centrar-bus');
      if (btnCentrarBus) btnCentrarBus.style.display = 'none';
    }

    function actualizarPosicionBus(lat, lng) {
      if (lat === null || lng === null || isNaN(lat) || isNaN(lng)) {
        ocultarBus();
        return;
      }

      ultimaRecepcionBus = Date.now();

      // Si el bus ya está en pantalla, exigir 3 lecturas consecutivas >= 15 metros antes de moverlo (cero saltos falsos)
      if (busPosActual && busMarker) {
        var distBus = calcularDistanciaMetros(busPosActual[0], busPosActual[1], lat, lng);
        if (distBus < UMBRAL_MOVIMIENTO_METROS) {
          confirmacionesMovBus = 0;
          return;
        }
        confirmacionesMovBus++;
        if (confirmacionesMovBus < 3) {
          return;
        }
        confirmacionesMovBus = 0;
        lat = (busPosActual[0] * 0.3) + (lat * 0.7);
        lng = (busPosActual[1] * 0.3) + (lng * 0.7);
      }

      busPosActual = [lat, lng];

      // Si el usuario esta en su Laptop (precision Wi-Fi > 15m) junto al celular (< 150m), fijar el punto blanco una sola vez junto al bus
      if (!userPosFijada || (mejorAccuracyUsuario > 15 && calcularDistanciaMetros(userPosActual[0], userPosActual[1], lat, lng) < 150)) {
        userPosFijada = [lat + 0.000012, lng + 0.000015];
        userPosActual = [lat + 0.000012, lng + 0.000015];
        dibujarPuntoBlancoUsuario(userPosActual[0], userPosActual[1]);
      }

      if (!busMarker && map && typeof L !== 'undefined') {
        var busIcon = L.divIcon({
          className: 'bus-marker-container',
          html: '<div style="position:relative;"><div class="bus-pulse-ring"></div><div class="bus-pin-core"><span class="material-symbols-outlined" style="font-size:18px; font-weight:bold;">directions_bus</span></div></div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        busMarker = L.marker(busPosActual, { icon: busIcon, zIndexOffset: 1500 })
          .addTo(map)
          .bindPopup("<b>Bus Barranca</b><br>Circuito Universitario");
      } else if (busMarker) {
        busMarker.setLatLng(busPosActual);
      }

      // Enfocar automaticamente el bus mas cercano al detectarlo por primera vez
      if (!yaEnfocoBusCercano && map) {
        yaEnfocoBusCercano = true;
        map.flyTo(busPosActual, 17, { animate: true, duration: 1 });
      }

      var dotEl = document.getElementById('live-dot');
      if (dotEl) dotEl.className = "w-2 h-2 rounded-full bg-white animate-pulse";

      var headerEl = document.getElementById('header-status');
      if (headerEl) headerEl.innerText = "BUS EN RUTA";

      var badgeEl = document.getElementById('bus-live-badge');
      if (badgeEl) {
        badgeEl.innerText = "EN VIVO";
        badgeEl.className = "text-[9px] font-bold text-black bg-white px-2 py-0.5 rounded-full tracking-wider uppercase";
      }

      var iconBg = document.getElementById('bus-card-icon-bg');
      if (iconBg) iconBg.className = "w-11 h-11 rounded-2xl bg-white text-black flex items-center justify-center shadow-md";

      var iconEl = document.getElementById('bus-card-icon');
      if (iconEl) iconEl.className = "material-symbols-outlined text-black text-2xl";

      var subEl = document.getElementById('bus-subtext');
      if (subEl) subEl.innerText = "Circuito Universitario";

      var btnCentrarBus = document.getElementById('btn-centrar-bus');
      if (btnCentrarBus) btnCentrarBus.style.display = 'flex';
    }

    function centrarEnBus() {
      if (map && busPosActual) {
        map.flyTo(busPosActual, 17, { animate: true, duration: 1 });
        if (busMarker) busMarker.openPopup();
      }
    }

    function cargarUltimaPosicion() {
      fetch(SUPABASE_URL + "/rest/v1/rastreo?id=eq.bus_keisel_1&select=*", {
        method: 'GET',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Cache-Control': 'no-cache'
        },
        cache: 'no-store'
      })
      .then(function(r) { return r.json(); })
      .then(function(rows) {
        if (!rows || !rows.length) {
          ocultarBus();
          return;
        }
        var data = rows[0];
        if (data.latitud === null || data.longitud === null) {
          ultimoTimestampVisto = data.actualizado_en;
          primeraConsultaTabla = false;
          ocultarBus();
          return;
        }

        // En la primera lectura al abrir la web, si ya se actualizo en los ultimos 25 segundos, mostrar de inmediato
        if (primeraConsultaTabla) {
          primeraConsultaTabla = false;
          ultimoTimestampVisto = data.actualizado_en;
          var diffInicial = Math.abs(Date.now() - new Date(data.actualizado_en).getTime()) / 1000;
          if (diffInicial <= 25) {
            actualizarPosicionBus(Number(data.latitud), Number(data.longitud));
          }
          return;
        }

        // En cada consulta cada 1.5s: si el timestamp cambió respecto a la lectura anterior, está transmitiendo EN VIVO
        if (data.actualizado_en && data.actualizado_en !== ultimoTimestampVisto) {
          ultimoTimestampVisto = data.actualizado_en;
          actualizarPosicionBus(Number(data.latitud), Number(data.longitud));
        }
      })
      .catch(function(err) {
        console.warn("Error consultando posicion:", err);
      });
    }

    function conectarRealtime() {
      var client = getSupabase();
      if (!client) return;

      try {
        client
          .channel('keisel-realtime')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'rastreo' },
            function(payload) {
              if (payload.new && payload.new.latitud !== null && payload.new.longitud !== null) {
                ultimoTimestampVisto = payload.new.actualizado_en;
                primeraConsultaTabla = false;
                actualizarPosicionBus(Number(payload.new.latitud), Number(payload.new.longitud));
              } else {
                ocultarBus();
              }
            }
          )
          .subscribe();
      } catch (e) {
        console.warn("Realtime error:", e);
      }
    }

    // Inicializar mapa inmediatamente al cargar la ventana
    window.addEventListener('load', function() {
      initLeafletMap();
    });
  </script>
</body>
