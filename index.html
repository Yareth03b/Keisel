<!doctype html>
<html class="dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="color-scheme" content="only dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Keisel - Sistema de Transporte Universitario</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icons/android-chrome-192x192.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png?v=6"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png?v=6"
    />
    <link rel="shortcut icon" href="assets/icons/favicon.ico?v=6" />
    <link rel="manifest" href="site.webmanifest?v=6" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link crossorigin="" href="https://router.project-osrm.org" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <link rel="stylesheet" href="assets/leaflet.css" />
    <script src="assets/leaflet.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="keisel-body">
    <!-- ====================================================================== -->
    <!-- MAPA PRINCIPAL (LEAFLET EN EL FONDO)                                  -->
    <!-- ====================================================================== -->
    <div id="map"></div>

    <!-- ====================================================================== -->
    <!-- VISTA 1: INICIO (ESTUDIANTES)                                         -->
    <!-- ====================================================================== -->
    <div id="vista-inicio" class="vista-inicio">
      <main class="inicio-contenedor">
        <!-- Logo Oficial Keisel en Vector Blanco/Dark -->
        <header class="inicio-header" data-purpose="brand-header">
          <img
            src="assets/brand/logo_keisel_dark.svg?v=6"
            alt="Keisel Logo"
            class="inicio-logo"
          />
        </header>

        <!-- TARJETA 1: ESTUDIANTES -->
        <section class="card-estudiantes-wrap" data-purpose="card-estudiantes-wrapper">
          <div
            onclick="navegarA('mapa')"
            class="card-estudiantes"
            role="button"
            tabindex="0"
            aria-label="Acceder como Estudiante"
          >
            <div class="card-estudiantes-top">
              <div class="card-icono-caja">
                <svg
                  class="card-icono-svg"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.3"
                  viewBox="0 0 24 24"
                >
                  <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                  <path d="M3 11h18"></path>
                  <path d="M19 19v2"></path>
                  <path d="M5 19v2"></path>
                  <circle
                    cx="7.5"
                    cy="15"
                    fill="currentColor"
                    r="1.2"
                    stroke="none"
                  ></circle>
                  <circle
                    cx="16.5"
                    cy="15"
                    fill="currentColor"
                    r="1.2"
                    stroke="none"
                  ></circle>
                </svg>
              </div>
              <div class="card-check-circulo">
                <svg
                  class="card-check-svg"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>
            <div class="card-titulo-wrap">
              <span class="card-titulo">Estudiantes</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ====================================================================== -->
    <!-- VISTA 2: MAPA DE ESTUDIANTES EN VIVO (HUD DE SEGUIMIENTO)              -->
    <!-- ====================================================================== -->
    <div id="vista-mapa" class="vista-mapa hidden">
      <!-- Barra Superior Flotante -->
      <header class="hud-header pt-safe">
        <div class="hud-barra">
          <button
            onclick="retrocederDesdeMapa()"
            class="btn-volver"
            type="button"
          >
            <svg
              class="btn-volver-icono"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
            <span id="btn-mapa-back-text" class="btn-volver-texto"
              >Estudiantes</span
            >
          </button>

          <div class="estado-pill">
            <span id="live-dot" class="estado-dot"></span>
            <span id="header-status" class="estado-texto">SIN BUS EN RUTA</span>
          </div>

          <button
            onclick="abrirModalUbicacion()"
            class="btn-ajustes"
            title="Configurar permiso de ubicación"
            type="button"
          >
            <span class="material-symbols-outlined icono-16">tune</span>
          </button>
        </div>

        <!-- Filtro de Rutas Superior -->
        <nav
          id="filtro-rutas"
          class="filtro-rutas"
          role="tablist"
          aria-label="Seleccionar ruta de transporte"
        >
          <button
            type="button"
            role="tab"
            aria-selected="true"
            data-ruta="todos"
            class="btn-ruta btn-ruta--activo"
            onclick="seleccionarFiltroRuta('todos')"
          >
            Todos
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-ruta="barranca"
            class="btn-ruta"
            onclick="seleccionarFiltroRuta('barranca')"
          >
            Barranca
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-ruta="supe"
            class="btn-ruta"
            onclick="seleccionarFiltroRuta('supe')"
          >
            Supe
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-ruta="paramonga"
            class="btn-ruta"
            onclick="seleccionarFiltroRuta('paramonga')"
          >
            Paramonga
          </button>
        </nav>
        <div class="mensaje-recorrido" id="mensaje-recorrido" role="status"></div>
      </header>

      <!-- Controles Laterales Flotantes y Tarjeta Inferior Desplegable -->
      <div class="hud-inferior pb-safe">
        <div class="controles-mapa-wrap">
          <div class="controles-mapa">
            <!-- 1. Botón Centrar Mi Ubicación -->
            <button
              aria-label="Centrar en mi ubicación"
              class="btn-mapa-circular"
              onclick="centrarEnMiUbicacion()"
              type="button"
              title="Ir a mi ubicación"
            >
              <svg
                class="btn-mapa-icono"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="7"></circle>
                <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
                <line x1="12" y1="2" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="22"></line>
                <line x1="2" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="22" y2="12"></line>
              </svg>
            </button>

            <!-- 2. Botón Centrar en el Bus -->
            <button
              id="btn-centrar-bus"
              style="display: none"
              aria-label="Centrar en el Bus"
              class="btn-mapa-circular"
              onclick="centrarEnBus()"
              type="button"
              title="Centrar mapa en el bus"
            >
              <svg
                class="btn-mapa-icono"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                <path d="M3 11h18"></path>
                <circle
                  cx="7.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <circle
                  cx="16.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <path d="M6 19v2"></path>
                <path d="M18 19v2"></path>
              </svg>
            </button>

            <!-- 3 y 4. Controles de Zoom -->
            <div class="grupo-zoom">
              <button
                aria-label="Acercar"
                class="btn-zoom btn-zoom--superior"
                onclick="if (map) map.zoomIn();"
                type="button"
              >
                <svg
                  class="btn-zoom-icono"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  viewBox="0 0 24 24"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button
                aria-label="Alejar"
                class="btn-zoom"
                onclick="if (map) map.zoomOut();"
                type="button"
              >
                <svg
                  class="btn-zoom-icono"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  viewBox="0 0 24 24"
                >
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- BOTÓN FLOTANTE TIPO CIRCULITO (VISIBLE POR DEFECTO AL INICIAR) -->
        <div
          id="btn-desplegar-buses"
          style="display: flex"
          class="btn-desplegar-wrap"
        >
          <button
            onclick="expandirPanelBuses()"
            class="btn-desplegar-bus"
            title="Ver información del bus"
            type="button"
          >
            <svg
              class="btn-desplegar-icono"
              fill="none"
              stroke="#000000"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <rect height="16" rx="4" width="18" x="3" y="3"></rect>
              <path d="M3 11h18"></path>
              <circle
                cx="7.5"
                cy="15"
                fill="#000000"
                r="1.2"
                stroke="none"
              ></circle>
              <circle
                cx="16.5"
                cy="15"
                fill="#000000"
                r="1.2"
                stroke="none"
              ></circle>
              <path d="M6 19v2"></path>
              <path d="M18 19v2"></path>
            </svg>
            <span class="punto-ping"></span>
            <span class="punto-fijo"></span>
          </button>
        </div>

        <!-- Tarjeta Flotante Inferior de Información del Bus -->
        <div
          id="panel-tarjeta-bus"
          style="display: none"
          class="tarjeta-bus"
        >
          <!-- Izquierda: Ícono del Bus e Información Dinámica -->
          <div class="tarjeta-bus-info">
            <div class="tarjeta-bus-icono-box" id="bus-card-icon-bg">
              <svg
                class="tarjeta-bus-icono"
                id="bus-card-icon"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <rect height="16" rx="4" width="18" x="3" y="3"></rect>
                <path d="M3 11h18"></path>
                <circle
                  cx="7.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <circle
                  cx="16.5"
                  cy="15"
                  fill="currentColor"
                  r="1.2"
                  stroke="none"
                ></circle>
                <path d="M6 19v2"></path>
                <path d="M18 19v2"></path>
              </svg>
            </div>
            <div class="tarjeta-bus-textos">
              <p class="tarjeta-bus-titulo" id="bus-main-name">
                Bus Universitario
              </p>
              <p class="tarjeta-bus-subtitulo" id="bus-subtext">
                Esperando señal GPS activa...
              </p>
              <p class="tarjeta-bus-frescura" id="bus-frescura" hidden></p>
            </div>
          </div>

          <!-- Derecha: Botón Seguir Bus, Badge EN VIVO y Botón Minimizar -->
          <div class="tarjeta-bus-acciones">
            <div id="bus-chips-container" class="chips-buses"></div>
            <span class="badge-vivo" id="bus-live-badge">DESCONECTADO</span>
            <button
              id="btn-seguir-bus"
              onclick="centrarEnBus()"
              class="btn-seguir-bus"
              title="Centrar bus en el mapa"
              type="button"
            >
              <svg
                class="btn-seguir-icono"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path>
              </svg>
              <span>Seguir Bus</span>
            </button>
            <button
              onclick="achicarPanelBuses()"
              class="btn-minimizar"
              title="Minimizar panel"
              type="button"
            >
              <svg
                class="btn-minimizar-icono"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notificación Toast Flotante -->
    <div id="toast-notify" class="toast-notify">
      <span class="material-symbols-outlined toast-icono">info</span>
      <span id="toast-msg">Notificación</span>
    </div>

    <!-- Lógica y Funcionalidades JavaScript de Keisel -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>

    <!-- MODAL DE CONFIGURACIÓN DE PERMISO DE UBICACIÓN -->
    <div id="modal-permiso-ubicacion" class="modal-overlay hidden">
      <div class="modal-ubicacion">
        <div class="modal-icono-wrap">
          <span class="material-symbols-outlined modal-icono">near_me</span>
        </div>
        <h3 class="modal-titulo">Permiso de Ubicación</h3>
        <p class="modal-descripcion">
          Keisel requiere tu ubicación para mostrarte los paraderos más cercanos
          y la distancia exacta al bus. Puedes cambiar esta opción en cualquier
          momento.
        </p>
        <div class="modal-acciones">
          <button
            onclick="configurarPermisoUbicacion('siempre')"
            class="btn-modal-primario"
            type="button"
          >
            Permitir siempre
          </button>
          <button
            onclick="configurarPermisoUbicacion('momento')"
            class="btn-modal-secundario"
            type="button"
          >
            Solo en este momento
          </button>
          <button
            onclick="cerrarModalUbicacion()"
            class="btn-modal-terciario"
            type="button"
          >
            Ahora no
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
