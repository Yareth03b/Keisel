<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Keisel Mobility - Mapa de Buses en Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0A0A0C;
        color: #e4e1e7;
        overflow: hidden;
      }
      body { overscroll-behavior-y: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    }
    ::-webkit-scrollbar { display: none; }
    
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111318;
      z-index: 1;
    }
    .leaflet-control-attribution { display: none !important; }

    /* Filtro oscuro elegante para OpenStreetMap (100% visible, sin apagones) */
    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.3);
    }

    /* Anillo de pulso verde neón para el bus */
    .bus-pulse-ring {
      position: absolute;
      top: -14px;
      left: -14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(0, 230, 118, 0.4);
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.75); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 0.15; }
      100% { transform: scale(0.75); opacity: 0.9; }
    }

    .bus-pin-core {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000000;
      border: 2.5px solid #00E676;
      box-shadow: 0 0 18px rgba(0, 230, 118, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00E676;
    }

    .leaflet-popup-content-wrapper {
      background: #14161E !important;
      color: #FFFFFF !important;
      border: 1px solid #2B303C !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }
    .leaflet-popup-tip {
      background: #14161E !important;
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col select-none overflow-hidden">
  
  <!-- MAPA LEAFLET 100% PANTALLA COMPLETA (Responsivo para PC y Celular) -->
  <div id="map"></div>

  <!-- INTERFAZ FLOTANTE SUPERPUESTA -->
  <div class="relative z-20 w-full h-screen flex flex-col justify-between pointer-events-none p-4 pb-safe pt-safe">
    
    <!-- Barra Superior Flotante -->
    <header class="w-full max-w-md mx-auto pointer-events-auto">
      <div class="h-14 w-full px-4 rounded-full bg-[#141416]/90 backdrop-blur-md border border-[#26262B] flex items-center justify-between shadow-2xl">
        <a class="flex items-center gap-2 text-white hover:text-neutral-300 transition-colors py-1 pl-0.5" href="index.html">
          <span class="material-symbols-outlined text-xl text-[#A0A0A0]">arrow_back</span>
          <span class="text-sm font-bold tracking-tight text-white">Estudiantes</span>
        </a>
        
        <!-- Indicador de Estado del Bus -->
        <div class="flex items-center gap-2 bg-[#0E1B14] px-3.5 py-1.5 rounded-full border border-[#163B25]" id="pill-container">
          <span class="w-2.5 h-2.5 rounded-full bg-[#00E676] animate-pulse" id="live-dot"></span>
          <span class="text-xs font-bold text-[#00E676] uppercase tracking-wider" id="header-status">Conectando...</span>
        </div>
      </div>
    </header>

    <!-- Controles Flotantes y Tarjeta Inferior -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-3 pointer-events-none">
      
      <!-- Botones flotantes (Centrar y Zoom) -->
      <div class="flex justify-end pointer-events-none">
        <div class="flex flex-col gap-2 pointer-events-auto">
          <button aria-label="Centrar en el Bus" class="w-11 h-11 rounded-full bg-[#141416]/95 backdrop-blur-md border border-[#26262B] text-white flex items-center justify-center shadow-2xl hover:bg-[#202024] active:scale-95 transition-all cursor-pointer" onclick="centrarEnBus()" type="button">
            <span class="material-symbols-outlined text-xl text-[#00E676]">my_location</span>
          </button>
          
          <div class="rounded-2xl bg-[#141416]/95 backdrop-blur-md border border-[#26262B] flex flex-col items-center overflow-hidden shadow-2xl">
            <button aria-label="Acercar" class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all border-b border-[#242429] cursor-pointer" onclick="map.zoomIn()" type="button">
              <span class="material-symbols-outlined text-base">add</span>
            </button>
            <button aria-label="Alejar" class="w-11 h-10 text-white flex items-center justify-center hover:bg-[#202024] active:scale-95 transition-all cursor-pointer" onclick="map.zoomOut()" type="button">
              <span class="material-symbols-outlined text-base">remove</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Tarjeta Flotante del Bus Activo -->
      <div class="w-full bg-[#141416]/95 backdrop-blur-xl border border-[#26262B] rounded-3xl p-5 shadow-2xl flex flex-col gap-3 pointer-events-auto">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-[#00E676]/10 border border-[#00E676]/30 flex items-center justify-center shadow-md">
              <span class="material-symbols-outlined text-[#00E676] text-2xl">directions_bus</span>
            </div>
            <div>
              <h3 class="text-base font-extrabold text-white tracking-tight" id="bus-title">Bus Keisel #1</h3>
              <p class="text-xs text-[#8E8E93]" id="bus-conductor">Conductor: Carlos Mendoza Vargas</p>
            </div>
          </div>
          <span class="text-xs font-mono font-bold text-[#00E676] bg-[#0E1B14] px-3 py-1 rounded-xl border border-[#163B25]" id="time-badge">
            En vivo
          </span>
        </div>

        <!-- Coordenadas e info del recorrido -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-[#20222B] text-xs">
          <div>
            <span class="text-[10px] text-[#8E8E93] uppercase font-bold tracking-wider block">Ubicación GPS</span>
            <span class="font-mono text-white text-xs font-bold mt-0.5 block" id="coords-display">-10.72635, -77.77373</span>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-[#8E8E93] uppercase font-bold tracking-wider block">Estado de Señal</span>
            <span class="text-xs font-semibold text-[#00E676] mt-0.5 block" id="last-update">Transmitiendo</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = "https://mcqcfdivpikmrkkfbhsn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jcWNmZGl2cGlrbXJra2ZiaHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzg5NDIsImV4cCI6MjEwODg1NDk0Mn0.F6Yz31dJI4wQiINS1NwK-cNunO0V_3UEvD3IHgTJSC0";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- COORDENADAS OFICIALES DE TU UNIVERSIDAD ---
    const UNI_LAT = -10.72635;
    const UNI_LNG = -77.77373;
    const centroInicial = [UNI_LAT, UNI_LNG];

    // --- INICIALIZAR MAPA LEAFLET ---
    const map = L.map('map', {
      zoomControl: false
    }).setView(centroInicial, 16);

    // Cargar mapa
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Forzar renderizado de Leaflet tras cargar el DOM
    setTimeout(() => { map.invalidateSize(); }, 200);
    window.addEventListener('resize', () => { map.invalidateSize(); });

    // Paradero Principal de salida de la universidad
    const stopIcon = L.divIcon({
      className: 'paradero-icon',
      html: `<div style="width:14px; height:14px; border-radius:50%; background:#0D0E12; border:3px solid #00E676; box-shadow:0 0 12px rgba(0,230,118,0.8);"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    L.marker(centroInicial, { icon: stopIcon })
      .addTo(map)
      .bindPopup("<b>Paradero Principal de Buses</b><br>Salida del campus")
      .openPopup();

    // Marcador de Bus Neón
    const busIcon = L.divIcon({
      className: 'bus-marker-container',
      html: `
        <div style="position:relative;">
          <div class="bus-pulse-ring"></div>
          <div class="bus-pin-core">
            <span class="material-symbols-outlined" style="font-size:16px; font-weight:bold;">directions_bus</span>
          </div>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    let busMarker = null;
    let busPosActual = centroInicial;
    const historialRuta = [];
    const polyline = L.polyline([], {
      color: '#00E676',
      weight: 4.5,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    function actualizarPosicionBus(lat, lng) {
      busPosActual = [lat, lng];
      historialRuta.push(busPosActual);
      polyline.setLatLngs(historialRuta);

      if (!busMarker) {
        busMarker = L.marker(busPosActual, { icon: busIcon })
          .addTo(map)
          .bindPopup("<b>Bus Keisel #1</b><br>Carlos Mendoza en ruta");
        map.setView(busPosActual, 16);
      } else {
        busMarker.setLatLng(busPosActual);
      }

      // Actualizar tarjeta inferior
      document.getElementById('header-status').innerText = "Bus en Ruta";
      document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
      document.getElementById('time-badge').innerText = "En vivo";
    }

    function centrarEnBus() {
      if (busMarker) {
        map.flyTo(busPosActual, 17, { animate: true, duration: 1 });
      } else {
        map.flyTo(centroInicial, 16, { animate: true, duration: 1 });
      }
    }

    // --- CARGAR ÚLTIMA POSICIÓN DESDE SUPABASE ---
    async function cargarUltimaPosicion() {
      const { data } = await supabase
        .from('rastreo')
        .select('*')
        .eq('id', 'bus_keisel_1')
        .single();

      if (data && data.latitud && data.longitud) {
        actualizarPosicionBus(data.latitud, data.longitud);
      } else {
        document.getElementById('header-status').innerText = "Esperando Conductor";
      }
    }
    cargarUltimaPosicion();

    // --- ESCUCHAR CAMBIOS EN TIEMPO REAL VÍA WEBSOCKETS ---
    supabase
      .channel('keisel-realtime')
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'rastreo' },
        (payload) => {
          if (payload.new && payload.new.latitud && payload.new.longitud) {
            actualizarPosicionBus(payload.new.latitud, payload.new.longitud);
          }
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          if (!busMarker) {
            document.getElementById('header-status').innerText = "En Espera";
          }
        }
      });
  </script>
</body>
</html>
